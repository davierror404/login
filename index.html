<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Davi</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(to bottom right, #5e00b8, #000000);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }
    .container {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      width: 90%;
      max-width: 320px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }
    h1 {
      color: #fff;
      margin-bottom: 10px;
    }
    p {
      color: #ccc;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #8000ff;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      box-sizing: border-box;
    }
    .login-page, .image-page {
      display: none;
    }
    .image-page {
      display: block;
    }
    img {
      margin-top: 20px;
      max-width: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- Página de Login -->
  <div class="container login-page">
    <h1>Bem-vindo Davi</h1>
    <p>Por favor, confirme sua identidade</p>
    <input type="text" id="username" placeholder="Usuário" />
    <input type="password" id="password" placeholder="Senha" />
    <button onclick="login()">Entrar</button>
  </div>

  <!-- Página de Melhorar Imagem -->
  <div class="container image-page">
    <h1>Melhorar Imagem</h1>
    <p>Escolha uma imagem para melhorar a qualidade</p>
    <input type="file" id="imageUpload" />
    <button onclick="uploadImage()">Enviar Imagem</button>
    <img id="outputImage" src="" alt="Imagem melhorada" style="display:none;" />
  </div>

  <script>
    // Função de Login
    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      // Condicional de login
      if (user === "davi" && pass === "senha123") {
        document.querySelector(".login-page").style.display = "none"; // Oculta a tela de login
        document.querySelector(".image-page").style.display = "block"; // Exibe a página de melhorar imagem
      } else {
        alert("Usuário ou senha inválidos.");
        // Limpar campos após erro
        document.getElementById("username").value = '';
        document.getElementById("password").value = '';
      }
    }

    // Função de envio de imagem (simulação de upload)
    function uploadImage() {
      const fileInput = document.getElementById("imageUpload");
      const file = fileInput.files[0];

      if (!file) {
        alert("Por favor, selecione uma imagem.");
        return;
      }

      const formData = new FormData();
      formData.append("image", file);

      // Simulando a resposta da API (substituir com a chamada real à API)
      setTimeout(() => {
        const img = document.getElementById("outputImage");
        img.src = URL.createObjectURL(file); // Exibe a imagem enviada (sem processamento)
        img.style.display = "block"; // Exibir imagem
      }, 1500); // Simulação de tempo de resposta da API
    }
  </script>

</body>
</html>
