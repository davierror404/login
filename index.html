<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Melhorar Imagem</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(to bottom right, #5e00b8, #000000);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      width: 90%;
      max-width: 320px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      box-sizing: border-box; /* Garante que o padding não quebre o layout */
    }
    h1 {
      color: #fff;
      margin-bottom: 10px;
    }
    input[type="file"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box; /* Garante que o padding não quebre o layout */
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #8000ff;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      box-sizing: border-box; /* Garante que o padding não quebre o layout */
    }
    img {
      margin-top: 20px;
      max-width: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Melhorar Imagem</h1>
    <p>Escolha uma imagem para melhorar a qualidade</p>
    <input type="file" id="imageUpload" />
    <button onclick="uploadImage()">Enviar Imagem</button>
    <img id="outputImage" src="" alt="Imagem melhorada" style="display:none;" />
  </div>

  <script>
    function uploadImage() {
      const fileInput = document.getElementById("imageUpload");
      const file = fileInput.files[0];
      const formData = new FormData();

      if (!file) {
        alert("Por favor, selecione uma imagem.");
        return;
      }

      formData.append("image", file);

      // Aqui você faria a chamada para a API do iLoveIMG
      // Exemplo com axios (requer instalar axios primeiro)
      axios.post('https://api.iloveimg.com/v1/image', formData, {
        headers: { 'Content-Type': 'multipart/form-data' }
      })
      .then(response => {
        const img = document.getElementById("outputImage");
        img.src = response.data.imagem_url; // Supondo que a resposta contenha a URL da imagem melhorada
        img.style.display = "block"; // Exibir imagem
      })
      .catch(error => {
        alert("Erro ao processar a imagem.");
        console.error(error);
      });
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</body>
</html>
