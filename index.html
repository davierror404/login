<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Melhorar Imagem</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(to bottom right, #5e00b8, #000000);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }
    .container {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      width: 90%;
      max-width: 320px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }
    h1 {
      color: #fff;
      margin-bottom: 10px;
    }
    p {
      color: #ccc;
      margin-bottom: 20px;
    }
    .file-upload-container {
      position: relative;
      width: 100%;
      padding: 12px;
      text-align: center;
      background-color: #8000ff;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-size: 16px;
      display: inline-block;
      box-sizing: border-box;
    }
    .file-upload-container input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #8000ff;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      box-sizing: border-box;
    }
    button:hover {
      background: #9c00e6;
    }
    .error-message {
      color: red;
      margin-top: 10px;
      display: none;
      font-size: 14px;
    }
    img {
      margin-top: 20px;
      max-width: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- Página de Melhorar Imagem -->
  <div class="container">
    <h1>Melhorar Imagem</h1>
    <p>Escolha uma imagem para melhorar a qualidade</p>

    <!-- Botão de upload personalizado -->
    <div class="file-upload-container">
      Escolher arquivo
      <input type="file" id="imageUpload" onchange="updateFileName()" />
    </div>

    <button onclick="uploadImage()">Enviar Imagem</button>
    <p class="error-message" id="error-message">Por favor, selecione uma imagem para enviar.</p>
    <img id="outputImage" src="" alt="Imagem melhorada" style="display:none;" />
  </div>

  <script>
    function updateFileName() {
      const fileInput = document.getElementById("imageUpload");
      const fileName = fileInput.files[0] ? fileInput.files[0].name : "Escolher arquivo";
      document.querySelector(".file-upload-container").textContent = fileName || "Escolher arquivo";
    }

    // Função de envio de imagem (simulação de upload)
    function uploadImage() {
      const fileInput = document.getElementById("imageUpload");
      const file = fileInput.files[0];
      const errorMessage = document.getElementById("error-message");

      // Limpar mensagem de erro
      errorMessage.style.display = "none";

      if (!file) {
        // Exibir erro se nenhum arquivo for selecionado
        errorMessage.style.display = "block";
        return;
      }

      const formData = new FormData();
      formData.append("image", file);

      // Simulando a resposta da API (substituir com a chamada real à API)
      setTimeout(() => {
        const img = document.getElementById("outputImage");
        img.src = URL.createObjectURL(file); // Exibe a imagem enviada (sem processamento)
        img.style.display = "block"; // Exibir imagem
      }, 1500); // Simulação de tempo de resposta da API
    }
  </script>

</body>
</html>
