<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Davi</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(to bottom right, #5e00b8, #000000);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      width: 90%;
      max-width: 320px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      box-sizing: border-box; /* Garante que o padding não quebre o layout */
    }
    h1 {
      color: #fff;
      margin-bottom: 10px;
    }
    p {
      color: #ccc;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box; /* Garante que o padding não quebre o layout */
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #8000ff;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      box-sizing: border-box; /* Garante que o padding não quebre o layout */
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bem-vindo Davi</h1>
    <p>Por favor, confirme sua identidade</p>
    <input type="text" id="username" placeholder="Usuário" />
    <input type="password" id="password" placeholder="Senha" />
    <button onclick="login()">Entrar</button>
  </div>

  <script>
    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      // Condicional de login
      if (user === "error" && pass === "404") {
        window.location.href = "https://chat.com";  // Redireciona para chat.com
      } else {
        alert("Usuário ou senha inválidos.");
        // Limpar campos após erro
        document.getElementById("username").value = '';
        document.getElementById("password").value = '';
      }
    }
  </script>
</body>
</html>
